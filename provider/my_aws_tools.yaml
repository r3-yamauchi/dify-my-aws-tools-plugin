identity:
  author: r3-yamauchi
  name: my_aws_tools
  label:
    en_US: My AWS Tools
    ja_JP: My AWS Tools
    zh_Hans: My AWS Tools
    pt_BR: My AWS Tools
  description:
    en_US: The tools based on the AWS Services
    ja_JP: "AWSのサービスを使用する際に便利な *私のための* ツール集"
    zh_Hans: The tools based on the AWS Services
    pt_BR: The tools based on the AWS Services
  icon: icon.svg
  tags:
    - productivity
credentials_schema:
  - name: aws_access_key_id
    label:
      en_US: AWS Access Key ID
      ja_JP: AWS アクセスキー ID
    type: secret-input
    required: false
    description:
      en_US: Optional Access Key ID used when invoking AWS APIs.
      ja_JP: AWS API 呼び出し時に使用する任意の Access Key ID。
  - name: aws_secret_access_key
    label:
      en_US: AWS Secret Access Key
      ja_JP: AWS シークレットアクセスキー
    type: secret-input
    required: false
    description:
      en_US: Optional Secret Access Key paired with the Access Key ID.
      ja_JP: Access Key ID とペアで使用する任意のシークレットキー。
  - name: aws_region
    label:
      en_US: Default AWS Region
      ja_JP: デフォルト AWS リージョン
    type: text-input
    required: false
    description:
      en_US: Region used by tools when a tool-specific region is not provided.
      ja_JP: 各ツールでリージョンが指定されない場合に用いるデフォルト値。
tools:
  - tools/bedrock_retrieve.yaml
  - tools/bedrock_retrieve_and_generate.yaml
  - tools/apply_guardrail.yaml
  - tools/bedrock_kb_list.yaml
  - tools/bedrock_kb_list_data_sources.yaml
  - tools/bedrock_kb_start_ingestion_job.yaml
  - tools/stepfunctions_start_execution.yaml
  - tools/lambda_invoker.yaml
  - tools/lambda_yaml_to_json.yaml
  - tools/s3_operator.yaml
  - tools/s3_file_uploader.yaml
  - tools/s3_file_download.yaml
  - tools/s3_list_buckets.yaml
  - tools/s3_create_bucket.yaml
  - tools/s3_list_objects.yaml
  - tools/dynamodb_manager.yaml
  - tools/sns_publish.yaml
  - tools/sqs_send_message.yaml
  - tools/nova_canvas.yaml
  - tools/nova_reel.yaml
  - tools/extract_frame.yaml
  - tools/agentcore_memory.yaml
  - tools/agentcore_memory_search.yaml
  - tools/agentcore_code_interpreter.yaml
extra:
  python:
    source: provider/my_aws_tools.py
