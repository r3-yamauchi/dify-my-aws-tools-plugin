identity:
  name: get_credentials
  author: r3-yamauchi
  label:
    en_US: AWS Get Credentials
    ja_JP: AWS 認証情報取得
description:
  human:
    en_US: Retrieve AWS credentials from boto3.Session using a specified profile and region.
    ja_JP: 指定されたプロファイルとリージョンを使用して boto3.Session から AWS 認証情報を取得します。
  llm: Get AWS credentials (access key, secret key, session token) from a boto3 session for use in workflows.
parameters:
  - name: profile_name
    type: string
    required: false
    label:
      en_US: AWS Profile Name
      ja_JP: AWS プロファイル名
    human_description:
      en_US: The name of the AWS profile to use (from ~/.aws/credentials or ~/.aws/config). If not specified, uses the default profile.
      ja_JP: 使用する AWS プロファイル名（~/.aws/credentials または ~/.aws/config から）。指定しない場合はデフォルトプロファイルを使用します。
    placeholder: development
    form: form

  - name: region_name
    type: string
    required: false
    label:
      en_US: AWS Region Name
      ja_JP: AWS リージョン名
    human_description:
      en_US: The AWS region to use for the session. If not specified, uses the region from the profile or default region.
      ja_JP: セッションで使用する AWS リージョン。指定しない場合はプロファイルまたはデフォルトリージョンを使用します。
    placeholder: ap-northeast-1
    form: form
extra:
  python:
    source: tools/get_credentials.py
