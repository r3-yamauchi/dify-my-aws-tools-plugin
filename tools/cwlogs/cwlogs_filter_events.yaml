identity:
  name: cwlogs_filter_events
  author: r3-yamauchi
  label:
    en_US: CloudWatch Logs Filter Events
    zh_Hans: CloudWatch Logs 过滤事件
    pt_BR: CloudWatch Logs Filtrar Eventos
    ja_JP: CloudWatch Logs ログイベント検索
description:
  human:
    en_US: Search and retrieve log events from CloudWatch Logs with time range and filter pattern matching.
    zh_Hans: 使用时间范围和过滤模式从 CloudWatch Logs 搜索和检索日志事件。
    pt_BR: Pesquise e recupere eventos de log do CloudWatch Logs com intervalo de tempo e correspondência de padrão de filtro.
    ja_JP: CloudWatch Logs から時間範囲とフィルターパターンを使用してログイベントを検索・取得します。
  llm: Search CloudWatch Logs events with flexible filtering to retrieve specific log entries for debugging and analysis.
parameters:
  - name: aws_access_key_id
    type: string
    required: false
    label:
      en_US: AWS Access Key ID
      ja_JP: AWS アクセスキー ID
    human_description:
      en_US: Override the provider Access Key ID for this request if needed.
      ja_JP: 必要に応じてプロバイダー設定を上書きする Access Key ID。
    form: form

  - name: aws_secret_access_key
    type: string
    required: false
    label:
      en_US: AWS Secret Access Key
      ja_JP: AWS シークレットアクセスキー
    human_description:
      en_US: Override the provider Secret Access Key for this request if needed.
      ja_JP: 必要に応じてプロバイダー設定を上書きするシークレットキー。
    form: form

  - name: aws_region
    type: string
    required: false
    label:
      en_US: AWS Region
      ja_JP: AWS リージョン
    human_description:
      en_US: Region used when calling CloudWatch Logs. Defaults to the provider setting.
      ja_JP: CloudWatch Logs 呼び出しに使用する AWS リージョン。既定はプロバイダー設定です。
    form: form

  - name: log_group_name
    type: string
    required: true
    label:
      en_US: Log Group Name
      ja_JP: ロググループ名
    human_description:
      en_US: Name of the CloudWatch Logs log group to search for log events.
      ja_JP: ログイベントを検索する CloudWatch Logs ロググループの名前。
    form: form

  - name: log_stream_names
    type: string
    required: false
    label:
      en_US: Log Stream Names
      ja_JP: ログストリーム名（複数）
    human_description:
      en_US: Comma-separated list of specific log stream names to search. Cannot be used with log_stream_name_prefix.
      ja_JP: 検索対象の特定のログストリーム名をカンマ区切りで指定。log_stream_name_prefix と同時使用不可。
    form: form

  - name: log_stream_name_prefix
    type: string
    required: false
    label:
      en_US: Log Stream Name Prefix
      ja_JP: ログストリーム名プレフィックス
    human_description:
      en_US: Search only log streams whose names start with this prefix. Cannot be used with log_stream_names.
      ja_JP: この文字列で始まるログストリームのみを検索対象にします。log_stream_names と同時使用不可。
    form: form

  - name: start_time
    type: string
    required: false
    label:
      en_US: Start Time
      ja_JP: 開始時刻
    human_description:
      en_US: "Start time for log search. Supports Unix timestamp (ms), ISO 8601 format, or relative time (e.g., \"1h\", \"30m\", \"2d\")."
      ja_JP: "ログ検索の開始時刻。Unix タイムスタンプ (ms)、ISO 8601 形式、または相対時刻 (例: \"1h\", \"30m\", \"2d\") をサポート。"
    form: form

  - name: end_time
    type: string
    required: false
    label:
      en_US: End Time
      ja_JP: 終了時刻
    human_description:
      en_US: "End time for log search. Supports Unix timestamp (ms), ISO 8601 format, or relative time (e.g., \"1h\", \"30m\", \"2d\")."
      ja_JP: "ログ検索の終了時刻。Unix タイムスタンプ (ms)、ISO 8601 形式、または相対時刻 (例: \"1h\", \"30m\", \"2d\") をサポート。"
    form: form

  - name: filter_pattern
    type: string
    required: false
    label:
      en_US: Filter Pattern
      ja_JP: フィルターパターン
    human_description:
      en_US: CloudWatch Logs filter pattern to match log events. Leave empty to retrieve all events.
      ja_JP: ログイベントにマッチする CloudWatch Logs フィルターパターン。空の場合は全イベントを取得。
    form: form

  - name: max_events
    type: number
    required: false
    label:
      en_US: Max Events
      ja_JP: 最大取得件数
    human_description:
      en_US: Maximum number of log events to return (1-10000). Defaults to 1000.
      ja_JP: 取得するログイベントの最大件数 (1-10000)。既定値は 1000。
    default: 1000
    form: form

  - name: next_token
    type: string
    required: false
    label:
      en_US: Next Token
      ja_JP: 継続トークン
    human_description:
      en_US: Supply the nextToken from a prior call to fetch the next page of results.
      ja_JP: 前回レスポンスの nextToken を指定して次ページの結果を取得します。
    form: form
extra:
  python:
    source: tools/cwlogs/cwlogs_filter_events.py