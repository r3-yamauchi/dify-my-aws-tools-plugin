identity:
  name: cwlogs_describe_streams
  author: r3-yamauchi
  label:
    en_US: CloudWatch Logs Describe Streams
    zh_Hans: CloudWatch Logs 描述流
    pt_BR: CloudWatch Logs Descrever Streams
    ja_JP: CloudWatch Logs ログストリーム検索
description:
  human:
    en_US: Search and list log streams within a specific CloudWatch Logs log group with optional prefix filtering.
    zh_Hans: 在指定的 CloudWatch Logs 日志组中搜索和列出日志流，支持可选的前缀过滤。
    pt_BR: Pesquise e liste streams de log dentro de um grupo de log específico do CloudWatch Logs com filtragem opcional por prefixo.
    ja_JP: 指定した CloudWatch Logs ロググループ内のログストリームを検索・一覧取得し、プレフィックスで絞り込みます。
  llm: Search CloudWatch Logs streams to identify target streams for subsequent log event retrieval operations.
parameters:
  - name: aws_access_key_id
    type: string
    required: false
    label:
      en_US: AWS Access Key ID
      ja_JP: AWS アクセスキー ID
    human_description:
      en_US: Override the provider Access Key ID for this request if needed.
      ja_JP: 必要に応じてプロバイダー設定を上書きする Access Key ID。
    form: form

  - name: aws_secret_access_key
    type: string
    required: false
    label:
      en_US: AWS Secret Access Key
      ja_JP: AWS シークレットアクセスキー
    human_description:
      en_US: Override the provider Secret Access Key for this request if needed.
      ja_JP: 必要に応じてプロバイダー設定を上書きするシークレットキー。
    form: form

  - name: aws_region
    type: string
    required: false
    label:
      en_US: AWS Region
      ja_JP: AWS リージョン
    human_description:
      en_US: Region used when calling CloudWatch Logs. Defaults to the provider setting.
      ja_JP: CloudWatch Logs 呼び出しに使用する AWS リージョン。既定はプロバイダー設定です。
    form: form

  - name: log_group_name
    type: string
    required: true
    label:
      en_US: Log Group Name
      ja_JP: ロググループ名
    human_description:
      en_US: Name of the CloudWatch Logs log group to search for log streams.
      ja_JP: ログストリームを検索する CloudWatch Logs ロググループの名前。
    form: form

  - name: log_stream_name_prefix
    type: string
    required: false
    label:
      en_US: Log Stream Name Prefix
      ja_JP: ログストリーム名プレフィックス
    human_description:
      en_US: Return only log streams whose names start with this prefix.
      ja_JP: この文字列で始まるログストリームのみを対象にします。
    form: form

  - name: order_by
    type: select
    required: false
    label:
      en_US: Order By
      ja_JP: ソート順
    human_description:
      en_US: Sort order for the log streams. LogStreamName sorts by name, LastEventTime sorts by last event time.
      ja_JP: ログストリームのソート順。LogStreamName は名前順、LastEventTime は最終イベント時刻順です。
    default: LogStreamName
    options:
      - value: LogStreamName
        label:
          en_US: Log Stream Name
          ja_JP: ログストリーム名順
      - value: LastEventTime
        label:
          en_US: Last Event Time
          ja_JP: 最終イベント時刻順
    form: form

  - name: descending
    type: boolean
    required: false
    label:
      en_US: Descending Order
      ja_JP: 降順ソート
    human_description:
      en_US: Sort in descending order (newest first for LastEventTime, Z-A for LogStreamName).
      ja_JP: 降順でソートします（LastEventTime の場合は新しい順、LogStreamName の場合は Z-A 順）。
    default: false
    form: form

  - name: max_items
    type: number
    required: false
    label:
      en_US: Max Items
      ja_JP: 最大取得件数
    human_description:
      en_US: Maximum number of log streams to return (1-50). Defaults to 50.
      ja_JP: 取得するログストリームの最大件数 (1-50)。既定値は 50。
    default: 50
    form: form

  - name: next_token
    type: string
    required: false
    label:
      en_US: Next Token
      ja_JP: 継続トークン
    human_description:
      en_US: Supply the nextToken from a prior call to fetch the next page of results.
      ja_JP: 前回レスポンスの nextToken を指定して次ページの結果を取得します。
    form: form
extra:
  python:
    source: tools/cwlogs/cwlogs_describe_streams.py