      zh_Hans: 是否覆盖现有模板（用于导入操作）
      pt_BR: Se deve sobrescrever modelo existente (para operação import)
      ja_JP: 既存のテンプレートを上書きするかどうか（インポート操作用）
    llm_description: Whether to overwrite existing template with same name (for import operation).
