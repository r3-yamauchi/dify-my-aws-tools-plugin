    required: false
    label:
      en_US: Filters
      zh_Hans: 过滤器
      pt_BR: Filtros
      ja_JP: フィルター
    human_description:
      en_US: JSON object with filter conditions (for list operation)
      zh_Hans: 包含过滤条件的JSON对象（用于列出操作）
      pt_BR: Objeto JSON com condições de filtro (para operação list)
      ja_JP: フィルター条件を含むJSONオブジェクト（一覧操作用）
    llm_description: |
      JSON object with filter conditions for listing templates.
      
      Example: {"tags": ["conversation"], "author": "admin"}
    form: llm

  - name: version1
    type: string
    required: false
    label:
      en_US: Version 1
      zh_Hans: 版本1
      pt_BR: Versão 1
      ja_JP: バージョン1
    human_description:
      en_US: First version for comparison (required for compare operation)
      zh_Hans: 用于比较的第一个版本（比较操作时必需）
      pt_BR: Primeira versão para comparação (obrigatório para operação compare)
      ja_JP: 比較する最初のバージョン（比較操作時に必須）
    llm_description: First version identifier for comparison (required for compare operation).
    form: llm

  - name: version2
    type: string
    required: false
    label:
      en_US: Version 2
      zh_Hans: 版本2
      pt_BR: Versão 2
      ja_JP: バージョン2
    human_description:
      en_US: Second version for comparison (required for compare operation)
      zh_Hans: 用于比较的第二个版本（比较操作时必需）
      pt_BR: Segunda versão para comparação (obrigatório para operação compare)
      ja_JP: 比較する2番目のバージョン（比較操作時に必須）
    llm_description: Second version identifier for comparison (required for compare operation).
    form: llm

  - name: version
    type: string
    required: false
    label:
      en_US: Version
      zh_Hans: 版本
      pt_BR: Versão
      ja_JP: バージョン
    human_description:
      en_US: Version to revert to (required for revert operation)
      zh_Hans: 要恢复到的版本（恢复操作时必需）
      pt_BR: Versão para reverter (obrigatório para operação revert)
      ja_JP: 復元するバージョン（復元操作時に必須）
    llm_description: Version identifier to revert to (required for revert operation).
    form: llm

  - name: storage_type
    type: select
    required: false
    options:
      - value: local
        label:
          en_US: Local Storage
          zh_Hans: 本地存储
          pt_BR: Armazenamento Local
          ja_JP: ローカルストレージ
      - value: s3
        label:
          en_US: S3 Storage
          zh_Hans: S3存储
          pt_BR: Armazenamento S3
          ja_JP: S3 ストレージ
    default: local
    label:
      en_US: Storage Type
      zh_Hans: 存储类型
      pt_BR: Tipo de Armazenamento
      ja_JP: ストレージタイプ
    human_description:
      en_US: Storage backend for templates (local or S3)
      zh_Hans: 模板的存储后端（本地或S3）
      pt_BR: Backend de armazenamento para modelos (local ou S3)
      ja_JP: テンプレートのストレージバックエンド（ローカルまたはS3）
    llm_description: Storage backend for templates - "local" for local filesystem or "s3" for S3 bucket.
    form: llm

  - name: s3_bucket
    type: string
    required: false
    label:
      en_US: S3 Bucket
      zh_Hans: S3存储桶
      pt_BR: Bucket S3
      ja_JP: S3 バケット
    human_description:
      en_US: S3 bucket name (required when storage_type is "s3")
      zh_Hans: S3存储桶名称（当storage_type为"s3"时必需）
      pt_BR: Nome do bucket S3 (obrigatório quando storage_type é "s3")
      ja_JP: S3 バケット名（storage_type が "s3" の場合に必須）
    llm_description: S3 bucket name for template storage (required when storage_type is "s3").
    form: llm

  - name: s3_prefix
    type: string
    required: false
    default: agentcore/templates/
    label:
      en_US: S3 Prefix
      zh_Hans: S3前缀
      pt_BR: Prefixo S3
      ja_JP: S3 プレフィックス
