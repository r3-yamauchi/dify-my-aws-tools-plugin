      en_US: S3 key prefix for templates (optional, default="agentcore/templates/")
      zh_Hans: 模板的S3键前缀（可选，默认="agentcore/templates/"）
      pt_BR: Prefixo de chave S3 para modelos (opcional, padrão="agentcore/templates/")
      ja_JP: テンプレート用のS3キープレフィックス（任意、デフォルト="agentcore/templates/"）
    llm_description: S3 key prefix for template storage (optional, default="agentcore/templates/").
    form: llm

  - name: aws_region
    type: string
    required: false
    label:
      en_US: AWS Region
      zh_Hans: AWS区域
      pt_BR: Região AWS
      ja_JP: AWS リージョン
    human_description:
      en_US: AWS region for the AgentCore Memory service (optional)
      zh_Hans: AgentCore Memory服务的AWS区域（可选）
      pt_BR: Região AWS para o serviço AgentCore Memory (opcional)
      ja_JP: AgentCore Memory サービスを利用する AWS リージョン（任意）
    llm_description: AWS region for the AgentCore Memory service.
    form: form

  - name: aws_access_key_id
    type: string
    required: false
    label:
      en_US: AWS Access Key ID
      zh_Hans: AWS访问密钥ID
      pt_BR: ID da Chave de Acesso AWS
      ja_JP: AWS アクセスキー ID
    human_description:
      en_US: AWS access key ID for authentication (optional)
      zh_Hans: 用于身份验证的AWS访问密钥ID（可选）
      pt_BR: ID da chave de acesso AWS para autenticação (opcional)
      ja_JP: 認証に使用する AWS アクセスキー ID（任意）
    llm_description: AWS access key ID for authentication.
    form: form

  - name: aws_secret_access_key
    type: string
    required: false
    label:
      en_US: AWS Secret Access Key
      zh_Hans: AWS秘密访问密钥
      pt_BR: Chave de Acesso Secreta AWS
      ja_JP: AWS シークレットアクセスキー
    human_description:
      en_US: AWS secret access key for authentication (optional)
      zh_Hans: 用于身份验证的AWS秘密访问密钥（可选）
      pt_BR: Chave de acesso secreta AWS para autenticação (opcional)
      ja_JP: 認証に使用する AWS シークレットアクセスキー（任意）
    llm_description: AWS secret access key for authentication.
    form: form

