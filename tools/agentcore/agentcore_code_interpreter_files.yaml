identity:
  name: agentcore_code_interpreter_files
  author: r3-yamauchi
  label:
    en_US: AgentCore Code Interpreter File Manager
    zh_Hans: AgentCore 代码解释器文件管理器
    pt_BR: Gerenciador de Arquivos do Code Interpreter AgentCore
    ja_JP: AgentCore Code Interpreter ファイル管理
  icon: icon.svg

description:
  human:
    en_US: Upload, download, list, and delete files in Code Interpreter execution environment
    zh_Hans: 在代码解释器执行环境中上传、下载、列出和删除文件
    pt_BR: Faça upload, download, liste e exclua arquivos no ambiente de execução do Code Interpreter
    ja_JP: Code Interpreter 実行環境でファイルのアップロード、ダウンロード、一覧取得、削除を行います
  llm: |
    AGENTCORE CODE INTERPRETER FILE MANAGER - Tool for managing files in Code Interpreter execution environment.
    
    OPERATIONS:
    - **UPLOAD** - Upload files to Code Interpreter environment
    - **DOWNLOAD** - Download result files from Code Interpreter
    - **LIST** - List all files with filtering, sorting, and pagination
    - **DELETE** - Delete files from Code Interpreter environment
    
    WHEN TO USE:
    - Need to provide data files for code execution
    - Want to retrieve generated files (graphs, CSV, etc.)
    - Need to manage files in Code Interpreter environment
    - Want to clean up unused files
    
    FILE SIZE LIMITS:
    - Maximum file size: 100 MB
    - Maximum file list size: 1000 files
    
    SECURITY:
    - Executable files are rejected (.exe, .bat, .sh, etc.)
    - Dangerous MIME types are blocked
    - File content is scanned before upload
    
    EXAMPLES:
    1. Upload file from local path:
       operation: "upload"
       file_path: "/path/to/data.csv"
    
    2. Upload file from content (Base64):
       operation: "upload"
       content: "base64_encoded_content"
       file_name: "data.csv"
    
    3. Upload multiple files:
       operation: "upload"
       file_path: ["/path/to/file1.csv", "/path/to/file2.json"]
    
    4. Download file:
       operation: "download"
       file_id: "file_12345"
    
    5. List files with filtering:
       operation: "list"
       file_type: ".csv"
       pattern: "data"
       sort_by: "size"
       page: 1
       page_size: 20
    
    6. Delete multiple files:
       operation: "delete"
       file_ids: ["file_001", "file_002", "file_003"]

parameters:
  - name: operation
    type: select
    required: true
    options:
      - value: upload
        label:
          en_US: Upload File
          zh_Hans: 上传文件
          pt_BR: Fazer Upload de Arquivo
          ja_JP: ファイルアップロード
      - value: download
        label:
          en_US: Download File
          zh_Hans: 下载文件
          pt_BR: Baixar Arquivo
          ja_JP: ファイルダウンロード
      - value: list
        label:
          en_US: List Files
          zh_Hans: 列出文件
          pt_BR: Listar Arquivos
          ja_JP: ファイル一覧
      - value: delete
        label:
          en_US: Delete File
          zh_Hans: 删除文件
          pt_BR: Excluir Arquivo
          ja_JP: ファイル削除
    default: upload
    label:
      en_US: Operation
      zh_Hans: 操作
      pt_BR: Operação
      ja_JP: 操作
    human_description:
      en_US: The operation to perform on files
      zh_Hans: 对文件执行的操作
      pt_BR: A operação a ser executada nos arquivos
      ja_JP: ファイルに対して実行する操作
    llm_description: The operation to perform on files in Code Interpreter environment.
    form: llm

  - name: file_path
    type: string
    required: false
    label:
      en_US: File Path
      zh_Hans: 文件路径
      pt_BR: Caminho do Arquivo
      ja_JP: ファイルパス
    human_description:
      en_US: Local file path for upload, or file path in Code Interpreter for download/delete
      zh_Hans: 用于上传的本地文件路径，或用于下载/删除的代码解释器中的文件路径
      pt_BR: Caminho do arquivo local para upload, ou caminho do arquivo no Code Interpreter para download/exclusão
      ja_JP: アップロード用のローカルファイルパス、またはダウンロード/削除用の Code Interpreter 内のファイルパス
    llm_description: |
      For upload: Local file path or JSON array of paths for batch upload.
      For download/delete: File path in Code Interpreter environment.
      
      Example: "/path/to/data.csv" or ["/path/to/file1.csv", "/path/to/file2.json"]
    form: llm

  - name: content
    type: string
    required: false
    label:
      en_US: File Content (Base64)
      zh_Hans: 文件内容（Base64）
      pt_BR: Conteúdo do Arquivo (Base64)
      ja_JP: ファイル内容（Base64）
    human_description:
      en_US: Base64-encoded file content for direct upload
      zh_Hans: 用于直接上传的Base64编码文件内容
      pt_BR: Conteúdo do arquivo codificado em Base64 para upload direto
      ja_JP: 直接アップロード用の Base64 エンコードされたファイル内容
    llm_description: Base64-encoded file content for direct upload (requires file_name parameter).
    form: llm

  - name: file_name
    type: string
    required: false
    label:
      en_US: File Name
      zh_Hans: 文件名
      pt_BR: Nome do Arquivo
      ja_JP: ファイル名
    human_description:
      en_US: File name for upload (required when using content parameter)
      zh_Hans: 上传的文件名（使用content参数时必需）
      pt_BR: Nome do arquivo para upload (obrigatório ao usar parâmetro content)
      ja_JP: アップロード時のファイル名（content パラメータ使用時に必須）
    llm_description: File name for upload (required when using content parameter, optional when using file_path).
    form: llm

  - name: file_id
    type: string
    required: false
    label:
      en_US: File ID
      zh_Hans: 文件ID
      pt_BR: ID do Arquivo
      ja_JP: ファイル ID
    human_description:
      en_US: File ID for download or delete operation
      zh_Hans: 用于下载或删除操作的文件ID
      pt_BR: ID do arquivo para operação de download ou exclusão
      ja_JP: ダウンロードまたは削除操作用のファイル ID
    llm_description: File ID for download or delete operation.
    form: llm

  - name: file_ids
    type: string
    required: false
    label:
      en_US: File IDs
      zh_Hans: 文件ID列表
      pt_BR: IDs dos Arquivos
      ja_JP: ファイル ID リスト
    human_description:
      en_US: JSON array or comma-separated file IDs for batch delete
      zh_Hans: 用于批量删除的JSON数组或逗号分隔的文件ID
      pt_BR: Array JSON ou IDs de arquivos separados por vírgula para exclusão em lote
      ja_JP: 一括削除用の JSON 配列またはカンマ区切りのファイル ID
    llm_description: |
      JSON array or comma-separated file IDs for batch delete.
      
      Example: ["file_001", "file_002"] or "file_001,file_002,file_003"
    form: llm

  - name: delete_all
    type: boolean
    required: false
    default: false
    label:
      en_US: Delete All Files
      zh_Hans: 删除所有文件
      pt_BR: Excluir Todos os Arquivos
      ja_JP: すべてのファイルを削除
    human_description:
      en_US: Delete all files in Code Interpreter environment (use with caution)
      zh_Hans: 删除代码解释器环境中的所有文件（请谨慎使用）
      pt_BR: Excluir todos os arquivos no ambiente Code Interpreter (use com cuidado)
      ja_JP: Code Interpreter 環境内のすべてのファイルを削除（注意して使用）
    llm_description: Delete all files in Code Interpreter environment (use with caution, cannot be undone).
    form: llm

  - name: file_type
    type: string
    required: false
    label:
      en_US: File Type Filter
      zh_Hans: 文件类型过滤器
      pt_BR: Filtro de Tipo de Arquivo
      ja_JP: ファイルタイプフィルター
    human_description:
      en_US: "Filter files by extension (e.g., \".csv\", \".json\") for list operation"
      zh_Hans: "按扩展名过滤文件（例如\".csv\"、\".json\"）用于列出操作"
      pt_BR: "Filtrar arquivos por extensão (ex: \".csv\", \".json\") para operação de listagem"
      ja_JP: "拡張子でファイルをフィルター（例: \".csv\", \".json\"）一覧操作用"
    llm_description: Filter files by extension (e.g., ".csv", ".json") for list operation.
    form: llm

  - name: pattern
    type: string
    required: false
    label:
      en_US: File Name Pattern
      zh_Hans: 文件名模式
      pt_BR: Padrão de Nome de Arquivo
      ja_JP: ファイル名パターン
    human_description:
      en_US: Filter files by name pattern (partial match) for list operation
      zh_Hans: 按名称模式过滤文件（部分匹配）用于列出操作
      pt_BR: Filtrar arquivos por padrão de nome (correspondência parcial) para operação de listagem
      ja_JP: ファイル名パターンでフィルター（部分一致）一覧操作用
    llm_description: Filter files by name pattern (partial match, case-insensitive) for list operation.
    form: llm

  - name: sort_by
    type: select
    required: false
    options:
      - value: name
        label:
          en_US: Name
          zh_Hans: 名称
          pt_BR: Nome
          ja_JP: 名前
      - value: size
        label:
          en_US: Size
          zh_Hans: 大小
          pt_BR: Tamanho
          ja_JP: サイズ
      - value: created_at
        label:
          en_US: Created Date
          zh_Hans: 创建日期
          pt_BR: Data de Criação
          ja_JP: 作成日時
    default: name
    label:
      en_US: Sort By
      zh_Hans: 排序方式
      pt_BR: Ordenar Por
      ja_JP: ソート順
    human_description:
      en_US: Sort files by name, size, or created date for list operation
      zh_Hans: 按名称、大小或创建日期对文件进行排序用于列出操作
      pt_BR: Ordenar arquivos por nome, tamanho ou data de criação para operação de listagem
      ja_JP: 名前、サイズ、作成日時でファイルをソート（一覧操作用）
    llm_description: Sort files by name (ascending), size (descending), or created_at (descending) for list operation.
    form: llm

  - name: page
    type: number
    required: false
    default: 1
    label:
      en_US: Page Number
      zh_Hans: 页码
      pt_BR: Número da Página
      ja_JP: ページ番号
    human_description:
      en_US: Page number for pagination (starts from 1)
      zh_Hans: 分页的页码（从1开始）
      pt_BR: Número da página para paginação (começa em 1)
      ja_JP: ページネーション用のページ番号（1から開始）
    llm_description: Page number for pagination (starts from 1, for list operation).
    form: llm

  - name: page_size
    type: number
    required: false
    default: 20
    label:
      en_US: Page Size
      zh_Hans: 每页大小
      pt_BR: Tamanho da Página
      ja_JP: ページサイズ
    human_description:
      en_US: Number of files per page (default=20)
      zh_Hans: 每页文件数（默认=20）
      pt_BR: Número de arquivos por página (padrão=20)
      ja_JP: 1ページあたりのファイル数（デフォルト=20）
    llm_description: Number of files per page (default=20, for list operation).
    form: llm

  - name: aws_region
    type: string
    required: false
    label:
      en_US: AWS Region
      zh_Hans: AWS区域
      pt_BR: Região AWS
      ja_JP: AWS リージョン
    human_description:
      en_US: AWS region for the AgentCore Code Interpreter service (optional)
      zh_Hans: AgentCore Code Interpreter服务的AWS区域（可选）
      pt_BR: Região AWS para o serviço AgentCore Code Interpreter (opcional)
      ja_JP: AgentCore Code Interpreter サービスを利用する AWS リージョン（任意）
    llm_description: AWS region for the AgentCore Code Interpreter service.
    form: form

  - name: aws_access_key_id
    type: string
    required: false
    label:
      en_US: AWS Access Key ID
      zh_Hans: AWS访问密钥ID
      pt_BR: ID da Chave de Acesso AWS
      ja_JP: AWS アクセスキー ID
    human_description:
      en_US: AWS access key ID for authentication (optional)
      zh_Hans: 用于身份验证的AWS访问密钥ID（可选）
      pt_BR: ID da chave de acesso AWS para autenticação (opcional)
      ja_JP: 認証に使用する AWS アクセスキー ID（任意）
    llm_description: AWS access key ID for authentication.
    form: form

  - name: aws_secret_access_key
    type: string
    required: false
    label:
      en_US: AWS Secret Access Key
      zh_Hans: AWS秘密访问密钥
      pt_BR: Chave de Acesso Secreta AWS
      ja_JP: AWS シークレットアクセスキー
    human_description:
      en_US: AWS secret access key for authentication (optional)
      zh_Hans: 用于身份验证的AWS秘密访问密钥（可选）
      pt_BR: Chave de acesso secreta AWS para autenticação (opcional)
      ja_JP: 認証に使用する AWS シークレットアクセスキー（任意）
    llm_description: AWS secret access key for authentication.
    form: form

extra:
  python:
    source: tools/agentcore/agentcore_code_interpreter_files.py
