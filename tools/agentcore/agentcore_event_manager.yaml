identity:
  name: agentcore_event_manager
  author: r3-yamauchi
  label:
    en_US: AgentCore Event Manager
    zh_Hans: AgentCore 事件管理器
    pt_BR: Gerenciador de Eventos AgentCore
    ja_JP: AgentCore イベント管理
  icon: icon.svg

description:
  human:
    en_US: AgentCore Event Manager tool for managing memory events (list, delete, batch delete, export)
    zh_Hans: AgentCore 事件管理器工具，用于管理记忆事件（列表、删除、批量删除、导出）
    pt_BR: Ferramenta de gerenciamento de eventos AgentCore para gerenciar eventos de memória (listar, excluir, excluir em lote, exportar)
    ja_JP: AgentCore のメモリーイベント管理（一覧取得、削除、バッチ削除、エクスポート）を行うツールです
  llm: |
    AGENTCORE EVENT MANAGER TOOL - Tool for managing Memory events (conversation history).
    
    OPERATIONS:
    1. **LIST** - Get list of events from a memory with filtering options
    2. **DELETE** - Delete a single event from memory
    3. **DELETE_BATCH** - Delete multiple events in batch (max 100 events)
    4. **EXPORT** - Export events in JSON or CSV format
    
    WHEN TO USE:
    - List: Need to view conversation history or debug agent interactions
    - Delete: Need to remove a specific incorrect or sensitive event
    - Delete_batch: Need to clean up multiple events at once
    - Export: Need to analyze conversation data or create reports
    
    **Functions**:
    - List: client.list_events(memory_id, actor_id, session_id, start_time, end_time, max_results)
    - Delete: client.gmdp_client.delete_event(memoryId, eventId)
    - Delete_batch: Loop through event_ids and delete each
    - Export: Format events as JSON or CSV
    
    **Filtering Options**:
    - actor_id: Filter by specific actor (user or agent)
    - session_id: Filter by conversation session
    - start_time: Filter events after this time (ISO 8601 format)
    - end_time: Filter events before this time (ISO 8601 format)
    - max_results: Limit number of results (default 100, max 1000)
    
    **Export Formats**:
    - JSON: Structured data with full event details
    - CSV: Tabular format for spreadsheet analysis
    
    **Pagination**:
    - Automatically handles pagination for large result sets
    - Respects max_results limit across all pages

parameters:
  - name: operation
    type: select
    required: true
    options:
      - value: list
        label:
          en_US: List Events
          zh_Hans: 列出事件
          pt_BR: Listar Eventos
          ja_JP: イベント一覧取得
      - value: delete
        label:
          en_US: Delete Event
          zh_Hans: 删除事件
          pt_BR: Excluir Evento
          ja_JP: イベント削除
      - value: delete_batch
        label:
          en_US: Delete Events Batch
          zh_Hans: 批量删除事件
          pt_BR: Excluir Eventos em Lote
          ja_JP: イベントバッチ削除
      - value: export
        label:
          en_US: Export Events
          zh_Hans: 导出事件
          pt_BR: Exportar Eventos
          ja_JP: イベントエクスポート
    label:
      en_US: Operation
      zh_Hans: 操作
      pt_BR: Operação
      ja_JP: 操作
    human_description:
      en_US: Select the event management operation to perform
      zh_Hans: 选择要执行的事件管理操作
      pt_BR: Selecione a operação de gerenciamento de eventos a ser executada
      ja_JP: 実行するイベント管理操作を選択します
    llm_description: |
      The type of event management operation to perform:
      - "list": Get list of events from memory
      - "delete": Delete a single event
      - "delete_batch": Delete multiple events in batch
      - "export": Export events in JSON or CSV format
    form: llm

  - name: memory_id
    type: string
    required: true
    label:
      en_US: Memory ID
      zh_Hans: 记忆ID
      pt_BR: ID da Memória
      ja_JP: メモリー ID
    human_description:
      en_US: ID of the memory resource (required for all operations)
      zh_Hans: 记忆资源ID（所有操作必需）
      pt_BR: ID do recurso de memória (obrigatório para todas as operações)
      ja_JP: メモリーリソースの ID（すべての操作で必須）
    llm_description: |
      The memory resource ID. Required for all operations.
    form: llm

  - name: event_id
    type: string
    required: false
    label:
      en_US: Event ID
      zh_Hans: 事件ID
      pt_BR: ID do Evento
      ja_JP: イベント ID
    human_description:
      en_US: ID of the event (required for delete operation)
      zh_Hans: 事件ID（删除操作必需）
      pt_BR: ID do evento (obrigatório para operação de excluir)
      ja_JP: イベントの ID（delete 操作時に必須）
    llm_description: |
      The event ID to delete. Required for "delete" operation.
    form: llm

  - name: event_ids
    type: string
    required: false
    label:
      en_US: Event IDs (comma-separated)
      zh_Hans: 事件ID（逗号分隔）
      pt_BR: IDs de Eventos (separados por vírgula)
      ja_JP: イベント ID（カンマ区切り）
    human_description:
      en_US: Comma-separated list of event IDs (required for delete_batch operation, max 100)
      zh_Hans: 逗号分隔的事件ID列表（批量删除操作必需，最多100个）
      pt_BR: Lista de IDs de eventos separados por vírgula (obrigatório para operação de excluir em lote, máximo 100)
      ja_JP: カンマ区切りのイベント ID リスト（delete_batch 操作時に必須、最大 100 件）
    llm_description: |
      Comma-separated list of event IDs to delete in batch. Required for "delete_batch" operation.
      Maximum 100 event IDs per batch.
    form: llm

  - name: actor_id
    type: string
    required: false
    label:
      en_US: Actor ID
      zh_Hans: 参与者ID
      pt_BR: ID do Ator
      ja_JP: Actor ID
    human_description:
      en_US: Filter events by actor ID (optional for list and export operations)
      zh_Hans: 按参与者ID筛选事件（列表和导出操作可选）
      pt_BR: Filtrar eventos por ID do ator (opcional para operações de listar e exportar)
      ja_JP: Actor ID でイベントをフィルタリング（list および export 操作時に任意）
    llm_description: |
      Optional actor ID filter for list and export operations. Only events
      from this actor will be returned.
    form: llm

  - name: session_id
    type: string
    required: false
    label:
      en_US: Session ID
      zh_Hans: 会话ID
      pt_BR: ID da Sessão
      ja_JP: セッション ID
    human_description:
      en_US: Filter events by session ID (optional for list and export operations)
      zh_Hans: 按会话ID筛选事件（列表和导出操作可选）
      pt_BR: Filtrar eventos por ID da sessão (opcional para operações de listar e exportar)
      ja_JP: セッション ID でイベントをフィルタリング（list および export 操作時に任意）
    llm_description: |
      Optional session ID filter for list and export operations. Only events
      from this session will be returned.
    form: llm

  - name: start_time
    type: string
    required: false
    label:
      en_US: Start Time (ISO 8601)
      zh_Hans: 开始时间（ISO 8601）
      pt_BR: Hora de Início (ISO 8601)
      ja_JP: 開始時刻（ISO 8601）
    human_description:
      en_US: Filter events after this time in ISO 8601 format (optional for list and export operations)
      zh_Hans: 以ISO 8601格式筛选此时间之后的事件（列表和导出操作可选）
      pt_BR: Filtrar eventos após este horário no formato ISO 8601 (opcional para operações de listar e exportar)
      ja_JP: この時刻以降のイベントをフィルタリング（ISO 8601 形式、list および export 操作時に任意）
    llm_description: |
      Optional start time filter in ISO 8601 format (e.g., "2024-01-01T00:00:00Z").
      Only events after this time will be returned.
    form: llm

  - name: end_time
    type: string
    required: false
    label:
      en_US: End Time (ISO 8601)
      zh_Hans: 结束时间（ISO 8601）
      pt_BR: Hora de Término (ISO 8601)
      ja_JP: 終了時刻（ISO 8601）
    human_description:
      en_US: Filter events before this time in ISO 8601 format (optional for list and export operations)
      zh_Hans: 以ISO 8601格式筛选此时间之前的事件（列表和导出操作可选）
      pt_BR: Filtrar eventos antes deste horário no formato ISO 8601 (opcional para operações de listar e exportar)
      ja_JP: この時刻以前のイベントをフィルタリング（ISO 8601 形式、list および export 操作時に任意）
    llm_description: |
      Optional end time filter in ISO 8601 format (e.g., "2024-12-31T23:59:59Z").
      Only events before this time will be returned.
    form: llm

  - name: format
    type: select
    required: false
    options:
      - value: json
        label:
          en_US: JSON
          zh_Hans: JSON
          pt_BR: JSON
          ja_JP: JSON
      - value: csv
        label:
          en_US: CSV
          zh_Hans: CSV
          pt_BR: CSV
          ja_JP: CSV
    label:
      en_US: Export Format
      zh_Hans: 导出格式
      pt_BR: Formato de Exportação
      ja_JP: エクスポート形式
    human_description:
      en_US: Export format for events (required for export operation)
      zh_Hans: 事件的导出格式（导出操作必需）
      pt_BR: Formato de exportação para eventos (obrigatório para operação de exportar)
      ja_JP: イベントのエクスポート形式（export 操作時に必須）
    llm_description: |
      Export format for events. Required for "export" operation.
      - "json": Structured JSON format with full event details
      - "csv": Tabular CSV format for spreadsheet analysis
    form: llm

  - name: max_results
    type: number
    required: false
    default: 100
    label:
      en_US: Maximum Results
      zh_Hans: 最大结果数
      pt_BR: Máximo de Resultados
      ja_JP: 最大取得件数
    human_description:
      en_US: Maximum number of events to return (1-1000, default 100)
      zh_Hans: 返回的最大事件数（1-1000，默认100）
      pt_BR: Número máximo de eventos a retornar (1-1000, padrão 100)
      ja_JP: 取得するイベント数の上限（1〜1000、デフォルト 100）
    llm_description: |
      Maximum number of events to return for list and export operations (1-1000, default 100).
      Pagination is automatically handled to respect this limit.
    form: llm

  - name: aws_region
    type: string
    required: false
    label:
      en_US: AWS Region
      zh_Hans: AWS区域
      pt_BR: Região AWS
      ja_JP: AWS リージョン
    human_description:
      en_US: AWS region for the AgentCore Memory service (optional)
      zh_Hans: AgentCore Memory服务的AWS区域（可选）
      pt_BR: Região AWS para o serviço AgentCore Memory (opcional)
      ja_JP: AgentCore Memory サービスを利用する AWS リージョン（任意）
    llm_description: AWS region for the AgentCore Memory service.
    form: form

  - name: aws_access_key_id
    type: string
    required: false
    label:
      en_US: AWS Access Key ID
      zh_Hans: AWS访问密钥ID
      pt_BR: ID da Chave de Acesso AWS
      ja_JP: AWS アクセスキー ID
    human_description:
      en_US: AWS access key ID for authentication (optional)
      zh_Hans: 用于身份验证的AWS访问密钥ID（可选）
      pt_BR: ID da chave de acesso AWS para autenticação (opcional)
      ja_JP: 認証に使用する AWS アクセスキー ID（任意）
    llm_description: AWS access key ID for authentication.
    form: form

  - name: aws_secret_access_key
    type: string
    required: false
    label:
      en_US: AWS Secret Access Key
      zh_Hans: AWS秘密访问密钥
      pt_BR: Chave de Acesso Secreta AWS
      ja_JP: AWS シークレットアクセスキー
    human_description:
      en_US: AWS secret access key for authentication (optional)
      zh_Hans: 用于身份验证的AWS秘密访问密钥（可选）
      pt_BR: Chave de acesso secreta AWS para autenticação (opcional)
      ja_JP: 認証に使用する AWS シークレットアクセスキー（任意）
    llm_description: AWS secret access key for authentication.
    form: form

extra:
  python:
    source: tools/agentcore/agentcore_event_manager.py
